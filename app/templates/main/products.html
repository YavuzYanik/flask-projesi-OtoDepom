{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 mt-3 border-bottom pb-3" style="border-color: var(--border-color) !important;">
    <h2 class="fw-bold mb-0 text-white">Tüm Ürünler</h2>
</div>

<div class="row">
    <div class="col-12 text-center py-5 mt-4" style="background-color: var(--surface-color); border: 1px dashed var(--border-color); border-radius: 12px;">
        <i class="fa-solid fa-boxes-stacked mb-4 opacity-25" style="font-size: 5rem; color: var(--accent-color);"></i>
        <h3 class="text-white fw-bold">E-Ticaret Modülü Hazırlanıyor</h3>
        <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">
            Yedek parça, motor yağı ve aksesuar ürünleri çok yakında burada listelenecek. Tüm mağaza ürünlerini buradan inceleyebileceksiniz.
        </p>
    </div>
</div>
{% endblock %}
