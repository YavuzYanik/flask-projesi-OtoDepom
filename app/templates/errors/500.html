<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Sunucu Hatası</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'VT323', monospace;
            overflow: hidden;
            color: #4D88FF; /* Retro Blue */
            position: relative;
            text-align: center;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }

        /* Scanlines */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* Glow and flicker */
        .screen-content {
            z-index: 3;
            text-shadow: 0 0 10px #4D88FF, 0 0 20px #4D88FF;
            animation: flicker 0.15s infinite;
            padding: 2rem;
            max-width: 90vw;
        }

        .error-code {
            font-size: min(15rem, 30vw);
            margin: 0;
            line-height: 1;
            letter-spacing: -5px;
        }

        .error-desc {
            font-size: min(2rem, 5vw);
            margin-top: 1.5rem;
            text-transform: uppercase;
            max-width: 800px;
            line-height: 1.3;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-home {
            margin-top: 3rem;
            display: inline-block;
            padding: 10px 20px;
            border: 2px solid #4D88FF;
            color: #4D88FF;
            text-decoration: none;
            font-size: 1.5rem;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(77, 136, 255, 0.5), inset 0 0 10px rgba(77, 136, 255, 0.5);
            cursor: pointer;
            z-index: 10;
            position: relative;
        }

        .btn-home:hover {
            background-color: #4D88FF;
            color: #000;
            box-shadow: 0 0 20px #4D88FF, inset 0 0 20px #4D88FF;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            5% { opacity: 0.85; }
            10% { opacity: 0.95; }
            15% { opacity: 1; }
            100% { opacity: 1; }
        }

        /* Vignette */
        .vignette {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 120%);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="vignette"></div>
    <div class="screen-content">
        <h1 class="error-code">505</h1>
        <div class="error-desc">
            SUNUCU HATASI (SERVER ERROR).<br>
            HMM, SUNUCUDA BİR SORUN OLUŞTU...<br>
            LÜTFEN TEKRAR DENEYİN.
        </div>
        
        <a href="/" class="btn-home">> ANA SAYFAYA DÖN</a>
    </div>
</body>
</html>
